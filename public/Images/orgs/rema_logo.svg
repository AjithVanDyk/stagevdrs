<svg xmlns="http://www.w3.org/2000/svg" width="140" height="60" viewBox="0 0 140 60" role="img" aria-labelledby="title desc">
  <title id="title">ReMA association logo placeholder</title>
  <desc id="desc">Simple badge with ReMA initials used as a temporary association logo.</desc>
  <defs>
    <linearGradient id="remaBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="136" height="56" rx="12" fill="url(#remaBg)"/>
  <rect x="6" y="8" width="128" height="44" rx="10" fill="#ffffff" opacity="0.96"/>
  <text x="20" y="36" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="20" font-weight="700" fill="#0369a1">ReMA</text>
  <text x="20" y="48" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="9" fill="#4b5563">Recycled Materials</text>
</svg>


